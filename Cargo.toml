[package]
name = "aleoflow"
version = "0.2.0"
edition = "2024"
description = "A developer CLI for Aleo — scaffold, build, test, audit, deploy, and generate TypeScript bindings for Leo programs."
repository = "https://github.com/DiverseXL/aleoflow"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Official Rust MCP SDK (modelcontextprotocol/rust-sdk). Chosen over the
# community alternatives (rust-mcp-sdk, mcp-rust) because it is maintained
# by the modelcontextprotocol org, is by far the most downloaded
# (18.8M+ total, ~9.5M recent at the time of writing), and is published
# regularly. Features: server+macros+schemars for tool definition, and
# transport-io for the stdio transport used by `aleoflow mcp`.
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }
