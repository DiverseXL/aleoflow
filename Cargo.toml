[package]
name = "aleoflow"
version = "0.1.1"
edition = "2024"
description = "A developer CLI for Aleo — scaffold, build, test, audit, deploy, and generate TypeScript bindings for Leo programs."
repository = "https://github.com/DiverseXL/aleoflow"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
